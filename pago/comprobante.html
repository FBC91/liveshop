<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveShop · Comprobante de compra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F6F0;--bg-soft:#F2EDE4;--card:#fff;--ink:#1A1916;--ink-soft:#5A5750;--ink-faint:#8B887F;--line:#E2DDD2;--amber:#B8862A;--green:#1E7E5A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:1.5rem}
.acts{max-width:560px;margin:0 auto 1rem;display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.acts[hidden]{display:none}
.acts button,.acts a{
  border:1px solid var(--amber);background:#fff;color:var(--amber);border-radius:8px;padding:.5rem .9rem;
  font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none;
}
.acts button.solid{background:var(--amber);color:#fff}
.doc{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2rem}
.head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.25rem}
.head h1{font-size:1.15rem}
.head .u{font-size:.78rem;color:var(--ink-faint);margin-top:.15rem}
.head .tipo{text-align:right;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.head .tipo b{display:block;font-size:.95rem;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:.2rem}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1.5rem;margin-bottom:1.25rem;font-size:.82rem}
.meta .k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.84rem;margin-bottom:1rem}
th,td{padding:.5rem 0;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.n,th.n{text-align:right}
tr.desc td{color:var(--green)}
tr.total td{border-bottom:none;font-weight:700;font-size:1.05rem;padding-top:.8rem}
.leyenda{font-size:.72rem;color:var(--ink-soft);line-height:1.6;background:var(--bg-soft);border-radius:8px;padding:.75rem .9rem}
.bad{max-width:560px;margin:0 auto;background:#F9E2DF;border:1px solid #EFC9C3;color:#8C2A1F;border-radius:10px;padding:1rem;font-size:.85rem;line-height:1.5}
@media print{
  body{background:#fff;padding:0}
  .acts{display:none}
  .doc{border:none;padding:0}
}
</style>
</head>
<body>
<div class="acts" id="acts" hidden>
  <a id="back" href="/liveshop/">← Volver a LiveShop</a>
  <button class="solid" type="button" id="printBtn">🖨 Imprimir / Guardar PDF</button>
</div>
<main id="doc"><p style="text-align:center;color:#8B887F;font-size:.85rem">Cargando comprobante…</p></main>

<script src="../comun.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = LS.esc, money = LS.money;
const q = new URLSearchParams(location.search);
const sala = LS.cleanRoom(q.get("sala") || q.get("room"));
const ref = (q.get("ref") || "").toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 24);

function bad(t){ $("doc").innerHTML = '<div class="bad">' + esc(t) + '</div>'; }

(async function(){
  if (!sala || !ref){ bad("Link de comprobante incompleto."); return; }
  let o;
  try{ o = await LS.rpc("liveshop_orden_ver", {p_sala:sala, p_ref:ref}); }
  catch(err){ bad(err.message); return; }
  if (o.estado !== "pagada"){
    bad(o.estado === "pendiente"
      ? "Esta compra todavía no se pagó: el comprobante aparece cuando el pago se confirma."
      : "Esta compra no se concretó (el link " + (o.estado === "vencida" ? "venció" : "fue anulado") + "), así que no tiene comprobante.");
    return;
  }
  document.title = "Comprobante " + o.ref + " · " + o.tienda.nombre;
  $("back").href = "/liveshop/?live=" + encodeURIComponent(o.tienda.sala);
  $("acts").hidden = false;
  const desc = Number(o.descuento) || 0;
  const promo = !desc ? "" :
    (o.promo_tipo ? (LS.PROMO_NOMBRE[o.promo_tipo] || "Descuento") + (o.cupon ? " + código " + o.cupon : "") : "Código " + (o.cupon || ""));
  $("doc").innerHTML =
    '<article class="doc">' +
      '<div class="head">' +
        '<div><h1>' + esc(o.tienda.nombre) + '</h1><div class="u">@' + esc(o.tienda.usuario) + ' · vendido por LiveShop</div></div>' +
        '<div class="tipo">Comprobante de compra<b>N.º ' + esc(o.ref) + '</b></div>' +
      '</div>' +
      '<div class="meta">' +
        '<div><div class="k">Fecha de pago</div>' + esc(LS.fechaLarga(o.pagada_at)) + '</div>' +
        '<div><div class="k">Cliente</div>' + esc(o.comprador || "Consumidor final") + '</div>' +
        '<div><div class="k">Medio de pago</div>LiveShop Pay (simulado)</div>' +
        '<div><div class="k">Estado</div>Pagado</div>' +
      '</div>' +
      '<table>' +
        '<thead><tr><th>Concepto</th><th class="n">Cant.</th><th class="n">Importe</th></tr></thead>' +
        '<tbody>' +
          '<tr><td>' + esc(o.concepto) + '</td><td class="n">1</td><td class="n">' + money(o.precio_lista) + '</td></tr>' +
          (desc ? '<tr class="desc"><td>' + esc(promo) + '</td><td></td><td class="n">−' + money(desc) + '</td></tr>' : "") +
          '<tr class="total"><td>Total</td><td></td><td class="n">' + money(o.total) + '</td></tr>' +
        '</tbody>' +
      '</table>' +
      '<p class="leyenda"><b>Comprobante de compra — no válido como factura.</b> ' +
        'Es parte de una demo de portfolio: el pago es simulado y no se cobró dinero real. ' +
        'En un producto real, este documento se reemplaza por el e-Ticket o la e-Factura que emite el vendedor.</p>' +
    '</article>';
})();
$("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
