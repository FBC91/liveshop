<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LiveShop · Checkout simulado</title>
<meta name="description" content="Checkout simulado de la demo LiveShop. No se procesa dinero real.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9F6F0;
  --bg-soft:#F2EDE4;
  --card:#FFFFFF;
  --ink:#1A1916;
  --ink-soft:#5A5750;
  --ink-faint:#8B887F;
  --line:#E2DDD2;
  --amber:#B8862A;
  --green:#1E7E5A;
  --green-soft:#DDF0E7;
  --red:#C0392B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
button,input{font-family:inherit}

.sim-banner{
  background:var(--ink);color:#F9F6F0;padding:.65rem 1rem;
  font-size:.78rem;text-align:center;display:flex;
  align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;
}
.sim-banner b{color:#D4A84B;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem}
.sim-banner a{color:#D4A84B;text-decoration:none;border-bottom:1px solid transparent}
.sim-banner a:hover{border-color:#D4A84B}

.wrap{
  flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:linear-gradient(180deg,var(--bg-soft) 0%, var(--bg) 100%);
}
.checkout{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  width:100%;max-width:420px;padding:1.75rem;
  box-shadow:0 8px 30px rgba(26,25,22,.08);
  display:flex;flex-direction:column;gap:1.1rem;
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .logo{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#D4A84B,#B8862A);font-size:1.15rem;
}
.brand .bn{font-weight:700;font-size:1rem;line-height:1.2;display:block}
.brand .bs{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block}

#content{display:flex;flex-direction:column;gap:1rem}
.summary{
  background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:1rem;
  display:flex;flex-direction:column;gap:.5rem;
}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.84rem}
.row .k{color:var(--ink-faint)}
.row .v{font-weight:600;text-align:right;word-break:break-word}
.row.desc .v{color:var(--green)}
.row .tach{text-decoration:line-through;color:var(--ink-faint);font-weight:500}
.total{border-top:1px solid var(--line);padding-top:.6rem;margin-top:.2rem}
.total .k{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.total .v{font-size:1.6rem;font-weight:700;color:var(--amber)}
.vence{font-size:.72rem;color:var(--ink-faint);text-align:right}

.cupon{display:flex;flex-direction:column;gap:.35rem}
.cupon summary{font-size:.8rem;color:var(--ink-soft);cursor:pointer}
.cupon form{display:flex;gap:.4rem;margin-top:.4rem}
.cupon input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;
  font-size:.86rem;text-transform:uppercase;background:var(--bg);outline:none;
}
.cupon input:focus{border-color:var(--amber)}
.cupon button{
  border:1px solid var(--amber);background:#fff;color:var(--amber);border-radius:8px;
  padding:.5rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer;
}
.cupon .msg{font-size:.74rem;min-height:1em}
.cupon .msg.ok{color:var(--green)}
.cupon .msg.err{color:var(--red)}

.btn{
  border:none;border-radius:9px;padding:.85rem 1rem;font-size:.92rem;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--green);color:#fff;transition:filter .15s;width:100%;text-decoration:none;
}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.line{background:#fff;color:var(--green);border:1px solid var(--green)}
.spinner{
  width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.done{
  background:var(--green-soft);border:1px solid #C5E4D6;border-radius:10px;
  padding:1.25rem;text-align:center;display:flex;flex-direction:column;gap:.4rem;
}
.done .em{font-size:2.2rem;line-height:1}
.done .t{font-weight:700;font-size:1.05rem;color:var(--green)}
.done .s{font-size:.8rem;color:var(--ink-soft);line-height:1.5}

.note{font-size:.72rem;color:var(--ink-faint);line-height:1.55;text-align:center}
.note a{color:var(--amber);text-decoration:none}
.bad{
  background:#F9E2DF;border:1px solid #EFC9C3;color:#8C2A1F;
  border-radius:10px;padding:1rem;font-size:.82rem;line-height:1.5;
}
.loading{font-size:.85rem;color:var(--ink-faint);text-align:center;padding:1.5rem 0}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="sim-banner">
  <b>Checkout simulado</b>
  <span>Esta página no procesa dinero real ni pide datos de tarjeta. Es parte de una demo de portfolio.</span>
  <a href="/liveshop/" id="bannerBack">← volver al live</a>
</div>

<main class="wrap">
  <section class="checkout">
    <div class="brand">
      <span class="logo" aria-hidden="true">💳</span>
      <span>
        <span class="bn">LiveShop Pay</span>
        <span class="bs" id="brandSub">Pago del live</span>
      </span>
    </div>
    <div id="content" aria-live="polite"><div class="loading">Cargando tu pago…</div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../comun.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const esc = LS.esc;
const money = LS.money;

/* La URL solo trae a que orden se refiere. Monto, concepto y descuento se leen
   de la base: antes viajaban en la URL y el comprador podia cambiarlos. */
const q = new URLSearchParams(location.search);
const ORDER = {
  ref: (q.get("ref") || "").toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 24),
  room: LS.cleanRoom(q.get("room") || q.get("sala")),
  peer: (q.get("peer") || "").slice(0, 64)
};
const backUrl = "/liveshop/" + (ORDER.room ? "?live=" + encodeURIComponent(ORDER.room) : "");
const comprobanteUrl = () => "comprobante.html?sala=" + encodeURIComponent(ORDER.room) + "&ref=" + encodeURIComponent(ORDER.ref);
$("bannerBack").href = backUrl;

const content = $("content");
let ORDEN = null;       // lo que devuelve la base
let cupon = null;       // {codigo, extra, total} si se aplico uno valido

function bad(texto){
  content.innerHTML = '<div class="bad">' + esc(texto) + '</div>' +
    '<p class="note"><a href="' + esc(backUrl) + '">Ir a LiveShop</a></p>';
}

async function cargar(){
  if (!ORDER.ref || !ORDER.room){
    bad("Link de pago inválido o incompleto. Volvé al live y pedile al vendedor que te lo reenvíe.");
    return;
  }
  try{
    ORDEN = await LS.rpc("liveshop_orden_ver", {p_sala:ORDER.room, p_ref:ORDER.ref});
  }catch(err){
    bad(err.message);
    return;
  }
  $("brandSub").textContent = "Pago a " + ORDEN.tienda.nombre;
  if (ORDEN.estado === "pagada"){ renderPagada(false); return; }
  if (ORDEN.estado !== "pendiente"){
    bad(ORDEN.estado === "vencida"
      ? "Este link de pago venció (duran 24 horas). Pedile uno nuevo al vendedor desde el chat del live."
      : "El vendedor anuló este link de pago. Si todavía querés el producto, escribile por el chat del live.");
    return;
  }
  renderForm();
}

function desglose(){
  const total = cupon ? cupon.total : ORDEN.total;
  const desc = Number(ORDEN.descuento) || 0;
  return '<div class="summary">' +
    '<div class="row"><span class="k">Tienda</span><span class="v">' + esc(ORDEN.tienda.nombre) + '</span></div>' +
    '<div class="row"><span class="k">Concepto</span><span class="v">' + esc(ORDEN.concepto) + '</span></div>' +
    (desc || cupon
      ? '<div class="row"><span class="k">Precio</span><span class="v tach">' + money(ORDEN.precio_lista) + '</span></div>'
      : "") +
    (desc
      ? '<div class="row desc"><span class="k">' + esc(LS.PROMO_NOMBRE[ORDEN.promo_tipo] || "Descuento") +
        '</span><span class="v">−' + money(desc) + '</span></div>'
      : "") +
    (cupon
      ? '<div class="row desc"><span class="k">Código ' + esc(cupon.codigo) + '</span><span class="v">−' + money(cupon.extra) + '</span></div>'
      : "") +
    '<div class="row"><span class="k">Referencia</span><span class="v">' + esc(ORDEN.ref) + '</span></div>' +
    '<div class="row total"><span class="k">Total</span><span class="v">' + money(total) + '</span></div>' +
    (ORDEN.vence_at ? '<div class="vence">El link vence en ' + esc(LS.restante(new Date(ORDEN.vence_at) - Date.now())) + '</div>' : "") +
  '</div>';
}

function renderForm(){
  const total = cupon ? cupon.total : ORDEN.total;
  content.innerHTML = desglose() +
    '<details class="cupon"' + (cupon ? " open" : "") + '>' +
      '<summary>¿Tenés un código del live?</summary>' +
      '<form id="cuponForm" autocomplete="off">' +
        '<input id="cuponInput" maxlength="16" placeholder="Ej: LIVE10" aria-label="Código de descuento" value="' + esc(cupon ? cupon.codigo : "") + '">' +
        '<button type="submit">Aplicar</button>' +
      '</form>' +
      '<div class="msg' + (cupon ? " ok" : "") + '" id="cuponMsg">' + (cupon ? "Código aplicado." : "") + '</div>' +
    '</details>' +
    '<button class="btn" id="payNow" type="button">Pagar ' + money(total) + '</button>' +
    '<p class="note">Al confirmar, el vendedor recibe el aviso en su chat al instante. ' +
    'No se te piden datos de tarjeta porque no hay cobro real.</p>';
  $("payNow").addEventListener("click", pay);
  $("cuponForm").addEventListener("submit", aplicarCupon);
}

async function aplicarCupon(e){
  e.preventDefault();
  const codigo = $("cuponInput").value.trim().toUpperCase();
  const msg = $("cuponMsg");
  if (!codigo){ cupon = null; renderForm(); return; }
  msg.className = "msg"; msg.textContent = "Verificando…";
  try{
    const r = await LS.rpc("liveshop_orden_ver", {p_sala:ORDER.room, p_ref:ORDER.ref, p_codigo:codigo});
    ORDEN = r;
    cupon = r.con_cupon;
    renderForm();
    if (cupon && Number(cupon.extra) === 0){
      $("cuponMsg").textContent = "El código es válido, pero esta compra ya tiene el descuento máximo (50%).";
    }
  }catch(err){
    cupon = null;
    msg.className = "msg err"; msg.textContent = err.message;
  }
}

let paying = false;

async function pay(){
  if (paying) return;
  paying = true;
  const btn = $("payNow");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';

  await new Promise(r => setTimeout(r, 900));

  /* El pago se registra en la base antes de avisar a nadie: aunque el vendedor
     haya cerrado su consola, la venta y el stock quedan bien. */
  let res;
  try{
    res = await LS.rpc("liveshop_orden_pagar", {p_sala:ORDER.room, p_ref:ORDER.ref, p_codigo:cupon ? cupon.codigo : null});
  }catch(err){
    paying = false;
    btn.disabled = false;
    btn.textContent = "Reintentar pago";
    let m = content.querySelector(".bad");
    if (!m){ m = document.createElement("div"); m.className = "bad"; content.insertBefore(m, btn); }
    m.textContent = err.message;
    return;
  }
  ORDEN.total = res.total;
  ORDEN.estado = "pagada";
  ORDEN.pagada_at = new Date().toISOString();

  let notified = false;
  if (ORDER.peer){
    try{
      const sb = window.supabase.createClient(LS.SB_URL, LS.SB_KEY, {realtime:{params:{eventsPerSecond:10}}});
      const ch = sb.channel("liveshop:" + ORDER.room, {config:{broadcast:{self:false}}});
      await new Promise((resolve) => {
        let settled = false;
        const done = () => { if (!settled){ settled = true; resolve(); } };
        setTimeout(done, 4000);
        ch.subscribe(async (status) => {
          if (status === "SUBSCRIBED"){
            try{
              await ch.send({type:"broadcast", event:"paid",
                             payload:{peerId:ORDER.peer, ref:ORDER.ref, monto:res.total}});
              notified = true;
            }catch(e){}
            setTimeout(done, 300);
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
            done();
          }
        });
      });
    }catch(e){ /* el aviso local de abajo sigue funcionando */ }
  }

  /* avisa a la pestana del comprador abierta en este mismo navegador */
  try{
    localStorage.setItem("liveshop_paid", JSON.stringify({ref:ORDER.ref, monto:res.total, at:Date.now()}));
  }catch(e){}
  LS.compras.agregar({ref:ORDER.ref, sala:ORDER.room, tienda:ORDEN.tienda.nombre, concepto:ORDEN.concepto,
                      total:Number(res.total), fecha:ORDEN.pagada_at});

  renderPagada(true, notified);
}

function renderPagada(recien, notified){
  content.innerHTML =
    '<div class="done">' +
      '<div class="em">✅</div>' +
      '<div class="t">' + (recien ? "Pago aprobado" : "Este link ya fue pagado") + '</div>' +
      '<div class="s">' + money(ORDEN.total) + ' · ' + esc(ORDEN.concepto) +
        '<br>Ref ' + esc(ORDEN.ref) + '</div>' +
    '</div>' +
    '<a class="btn line" href="' + esc(comprobanteUrl()) + '" target="_blank" rel="noopener">🧾 Ver comprobante</a>' +
    '<p class="note" id="afterPay">' +
      (recien
        ? (notified || !ORDER.peer
            ? 'El vendedor ya tiene registrada tu compra.'
            : 'Tu compra quedó registrada. Si el vendedor no la ve en el chat, pasale la referencia.')
        : 'No se volvió a cobrar nada.') +
    '</p>';

  const note = $("afterPay");
  const hasOpener = !!(window.opener && !window.opener.closed);
  if (recien && hasOpener){
    /* Volver al live es volver a la pestaña que ya esta abierta, no cargar otra:
       navegar aca duplicaria la sesion del comprador (misma identidad en dos
       pestañas de la misma sala). */
    note.innerHTML += '<br>Volviendo al live…';
    setTimeout(() => {
      try{ window.opener.focus(); }catch(e){}
      try{ window.close(); }catch(e){}
      /* si el navegador no deja cerrar, al menos que no quede sin salida */
      setTimeout(() => {
        note.innerHTML = 'Listo. Volvé a la pestaña del live para seguir comprando.';
      }, 600);
    }, 2200);
  } else if (!hasOpener){
    note.innerHTML += '<br><a href="' + esc(backUrl) + '">← volver al live</a>';
  }
}

cargar();
</script>
</body>
</html>
